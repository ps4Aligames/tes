name: Build Smart Repair WETOOL Controller Test
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -r requirements.txt
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Smart_Repair_WETOOL_Controller_Test --noupx main.py
      - name: Package portable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release\external | Out-Null
          Copy-Item dist\Smart_Repair_WETOOL_Controller_Test.exe release\
          Copy-Item external\wetool.exe release\external\
          Copy-Item external\spiway_v0.60_teensy2.0.hex release\external\
          Copy-Item README.txt release\
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Repair-WETOOL-Controller-Test
          path: release
