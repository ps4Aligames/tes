name: Build Smart Repair Safe Read

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Check Python
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

      - name: Check PyInstaller
        run: |
          python -m PyInstaller --version

      - name: Build EXE
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name Smart_Repair_Safe_Read `
            src/smart_repair.py

      - name: Check build result
        shell: powershell
        run: |
          if (!(Test-Path "dist/Smart_Repair_Safe_Read.exe")) {
            Write-Error "Smart_Repair_Safe_Read.exe tidak berhasil dibuat."
            exit 1
          }

          Get-Item "dist/Smart_Repair_Safe_Read.exe" |
            Select-Object Name, Length, FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Smart_Repair_Safe_Read
          path: dist/Smart_Repair_Safe_Read.exe
          if-no-files-found: error
