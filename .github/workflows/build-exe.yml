name: Build Smart Repair EXE
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Smart_Repair_Edition_Ali_Games src/smart_repair.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Smart_Repair_Edition_Ali_Games
          path: dist/Smart_Repair_Edition_Ali_Games.exe
