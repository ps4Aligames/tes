name: Build Smart Repair WETOOL Controller Test 5
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Smart_Repair_Controller_Test5 main.py
      - name: Prepare portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\external | Out-Null
          Copy-Item external\wetool.exe dist\external\wetool.exe -Force
          Copy-Item external\spiway_v0.60_teensy2.0.hex dist\external\spiway_v0.60_teensy2.0.hex -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Smart_Repair_Controller_Test5
          path: |
            dist/Smart_Repair_Controller_Test5.exe
            dist/external/wetool.exe
            dist/external/spiway_v0.60_teensy2.0.hex
