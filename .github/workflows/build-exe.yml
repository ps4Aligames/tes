name: Build Smart Repair EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Validate source
        shell: powershell
        run: |
          python -m py_compile main.py
          if (Test-Path 'external/wetool.exe') { Write-Host 'external/wetool.exe found in repository; it will NOT be bundled or required.' }

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Smart_Repair_Edition_Ali_Games --noupx main.py

      - name: Prepare portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release,release/assets | Out-Null
          Copy-Item 'dist/Smart_Repair_Edition_Ali_Games.exe' 'release/'
          Copy-Item 'assets/ali_games_logo.png' 'release/assets/'
          $readme = @(
            'SMART REPAIR EDITION BY ALI GAMES'
            ''
            'Stage 1 uses an internal WETOOL No.3-style flow:'
            'Serial ports -> choose COM -> SPIway/Juegos -> READ ALL.'
            'The main application does NOT launch or require wetool.exe.'
            'Hardware READ ALL is not faked; the real SPIway protocol must be integrated before binary NOR reads are executed.'
            'After a real BwE validation completes, the UI can request Y to continue.'
          )
          Set-Content -Path 'release/README.txt' -Value $readme -Encoding UTF8

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Repair-EXE
          path: dist/Smart_Repair_Edition_Ali_Games.exe

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Repair-Portable
          path: release/
