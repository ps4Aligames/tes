name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PS4_NOR_Inspector src/ps4_nor_inspector.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path 'dist/PS4_NOR_Inspector.exe')) { throw 'EXE tidak ditemukan' }
          Get-Item 'dist/PS4_NOR_Inspector.exe' | Format-List Name,Length,FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PS4-NOR-Inspector-v2-Windows
          path: dist/PS4_NOR_Inspector.exe
          if-no-files-found: error
          retention-days: 30
